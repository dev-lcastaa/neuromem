    reason: "durable semantic memory extracted from the discovery event"

  - from_key: bad_fix_increase_pool_size
    to_key: sem_pool_exhaustion_root_cause
    relationship_type: DERIVED_FROM
    confidence: 0.85
    reason: "first fix attempt based on the root cause understanding"

  - from_key: good_fix_async_with_context_manager
    to_key: bad_fix_increase_pool_size
    relationship_type: SUPERSEDES
    confidence: 0.98
    reason: "correct fix replaces the earlier ineffective one"

  - from_key: sem_async_resource_generalization
    to_key: good_fix_async_with_context_manager
    relationship_type: DERIVED_FROM
    confidence: 0.9
    reason: "the pattern generalized from the concrete fix"

  - from_key: redis_similar_incident
    to_key: sem_async_resource_generalization
    relationship_type: REINFORCES
    confidence: 0.95
    reason: "later incident confirmed the generalization"

  - from_key: redis_fix_reused_pattern
    to_key: good_fix_async_with_context_manager
    relationship_type: DERIVED_FROM
    confidence: 0.95
    reason: "reused the same pattern in a new subsystem"

  - from_key: sem_kubernetes_pool_masking
    to_key: false_lead_memory_limits
    relationship_type: DERIVED_FROM
    confidence: 0.9
    reason: "explains why the false lead persisted"

  - from_key: deploy_v3_4_context
    to_key: sem_health_check_antipattern
    relationship_type: RESULTED_IN
    confidence: 0.85
    reason: "the release surfaced the antipattern"

queries:
  - id: "q1-triage"
    question: >-
      For run {run_id}, our production FastAPI service is returning
      intermittent 502s and pods are getting OOMKilled after our latest
      release. Backend logs show occasional connection errors. What should we
      investigate first, and what should we not waste time on?
    top_k: 6
    expected_top_content_contains:
      - "pool"
      - "exhaustion"
      - "asyncpg"
    expected_recall_contains_any:
      - "connection pool"
      - "asyncpg"
      - "pg_stat_activity"
      - "exhaustion"
    expected_answer_contains:
      - "pool"
    expected_answer_missing:
      - "raise memory"
      - "increase memory limit"
      - "add more memory"

  - id: "q2-superseded-fix-trap"
    question: >-
      For run {run_id}, we're seeing asyncpg connection pool exhaustion
      under load. Should we just increase the pool size?
    top_k: 6
    expected_top_content_contains:
      - "async with"
      - "context manager"
      - "release"
    expected_recall_contains_any:
      - "async with"
      - "context manager"
      - "release rate"
    expected_answer_contains:
      - "context manager"
    expected_answer_missing:
      - "just increase"
      - "raise the pool"
      - "increase max_size"
      - "raising max_size"

  - id: "q3-analogical-reasoning"
    question: >-
      For run {run_id}, Redis is starting to throw `max number of clients
      reached` errors under the same load pattern that used to hit our
      Postgres pool. What is most likely happening, and how do we fix it?
    top_k: 6
    expected_top_content_contains:
      - "context manager"
      - "async with"
      - "pool"
    expected_recall_contains_any:
      - "async with"
      - "context manager"
      - "generalizes"
      - "same leak signature"
    expected_answer_contains:
      - "context manager"
    expected_answer_missing:
      - "increase max clients"
      - "raise max clients"

  - id: "q4-kubernetes-masking-explanation"
    question: >-
      For run {run_id}, why did our connection pool leak look like an
      OOMKill problem for weeks before we noticed the real cause?
    top_k: 6
    expected_top_content_contains:
      - "restart"
      - "reset"
      - "kubernetes"
    expected_recall_contains_any:
      - "restart"
      - "reset"
      - "OOMKill"
      - "masking"
    expected_answer_contains:
      - "restart"
    expected_answer_missing: []

  - id: "q5-root-cause-of-timing"
    question: >-
      For run {run_id}, what was actually different about the v3.4 release
      that made this bug appear when it did?
    top_k: 6
    expected_top_content_contains:
      - "v3.4"
      - "health"
      - "cache"
    expected_recall_contains_any:
      - "cache/warm"
      - "cache-warm"
      - "liveness"
      - "health check"
    expected_answer_contains:
      - "health"
    expected_answer_missing: []

  - id: "q6-procedural-recall"
    question: >-
      For run {run_id}, how do we prevent connection pool leaks in async
      Python code across every subsystem?
    top_k: 6
    expected_top_content_contains:
      - "async with"
      - "context manager"
      - "acquire"
    expected_recall_contains_any:
      - "async with pool.acquire"
      - "context manager"
      - "generalizes"
    expected_answer_contains:
      - "async with"
      - "context manager"
    expected_answer_missing:
      - "increase pool size"
      - "raise max_size"
