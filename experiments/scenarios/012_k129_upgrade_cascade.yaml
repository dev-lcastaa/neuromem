queries:
  - id: "q1-triple-root-cause-synthesis"
    question: >-
      For run {run_id}, what was the actual root cause of the Kubernetes
      1.29 upgrade cascade outage across the four services?
    top_k: 8
    expected_top_content_contains:
      - "mtls"
      - "kube-dns"
      - "redis"
    expected_recall_contains_any:
      - "mTLS"
      - "kube-dns"
      - "Redis"
      - "triple"
      - "three simultaneous"
    expected_answer_contains:
      - "mtls"
      - "kube-dns"
      - "redis"
    expected_answer_missing:
      - "the app deployment caused"
      - "the v4.7 deploy caused"
      - "morning deploy was the cause"

  - id: "q2-refute-false-blame"
    question: >-
      For run {run_id}, someone from another team is saying the morning
      app deployment of checkout-svc v4.7.0 caused the 1.29 outage. Is
      that correct? What does the postmortem say?
    top_k: 6
    expected_top_content_contains:
      - "not the cause"
      - "cleared of causation"
      - "did not improve"
    expected_recall_contains_any:
      - "not the cause"
      - "cleared of causation"
      - "app-team was incorrect"
      - "did not improve"
    expected_answer_contains:
      - "not"
    expected_answer_missing:
      - "yes, it caused"
      - "the deployment caused the outage"
      - "correct, that was the cause"

  - id: "q3-why-rollback-didnt-help"
    question: >-
      For run {run_id}, why did rolling back the morning checkout-svc
      v4.7.0 deployment not fix the 500 errors?
    top_k: 6
    expected_top_content_contains:
      - "not the cause"
      - "did not improve"
      - "unrelated"
    expected_recall_contains_any:
      - "did not improve"
      - "unrelated"
      - "coincided"
      - "cleared of causation"
    expected_answer_contains:
      - "not the cause"
    expected_answer_missing:
      - "the rollback fixed"

  - id: "q4-investigation-timeline"
    question: >-
      For run {run_id}, what order were the layers of the 1.29 outage
