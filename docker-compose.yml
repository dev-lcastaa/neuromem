
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.4
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '\"timed_out\":false'"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12

  memory_api:
    build:
      context: .
      dockerfile: apps/memory_api/Dockerfile
    container_name: neuromem-memory-api
    env_file: .env
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USER: ""
      OPENSEARCH_PASSWORD: ""
      OPENSEARCH_VERIFY_CERTS: "false"
      BOOTSTRAP_INDEXES: "true"
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  mcp:
    build:
      context: .
      dockerfile: apps/memory_api/Dockerfile
    command: ["python", "-m", "apps.mcp_server.main"]
    environment:
      MEMORY_API_URL: http://memory_api:8000
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      memory_api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST http://localhost:8001/mcp -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}' || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: neuromem-dashboard
    environment:
      MEMORY_API_URL: http://memory_api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      memory_api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opensearch-data:
