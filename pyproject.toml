[project]
name = "neuromem"
version = "0.1.0"
description = "Local, experimental AI-agent memory system inspired by human memory."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NeuroMem POC" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "opensearch-py>=2.7",
    "aiohttp>=3.10",
    "aio-pika>=9.4",
    "httpx>=0.27",
    "mcp>=1.26,<2",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "openai>=1.54",
    "ulid-py>=1.1",
    "langgraph>=0.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dashboard = [
    "streamlit>=1.39",
    "pandas>=2.2",
    "pyvis>=0.3",
    "altair>=5.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory", "models", "apps", "messaging", "ingestion"]

[tool.uv]
default-groups = ["dev"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["experiments/results", "opensearch/data"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "ASYNC",        # async correctness
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opensearchpy.*", "streamlit.*", "yaml", "pyvis.*", "pandas.*"]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires OpenSearch or paid APIs; gated by `-m integration`",
    "slow: expensive tests; opt in with `-m slow`",
]

[tool.coverage.run]
source = ["memory", "models", "apps"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
